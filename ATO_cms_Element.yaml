id: manager-password-reset-302

info:
  name: Manager password reset endpoint returns 302
  author: MarcusProgram
  severity: critical
  description: Detects a 302 redirect on the manager password-reset entry point.
  tags: php,cms,auth,reset,redirect

http:
  - method: GET
    path:
      - "{{BaseURL}}/manager/index.php?a=0&hash="

    redirects: false
    max-redirects: 0

    matchers-condition: and
    matchers:
      - type: status
        status:
          - 302

      - type: word
        part: header
        words:
          - "Location:"
